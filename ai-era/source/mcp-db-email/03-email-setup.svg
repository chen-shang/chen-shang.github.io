  <text x="700" y="94" text-anchor="middle" fill="#a5abb4" font-family="Menlo, monospace" font-size="19">email-mcp › Add Account</text>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19">
    <text x="132" y="172" fill="#8f96a0">Account name</text><text x="530" y="172" fill="#e9edf1">qq</text>
